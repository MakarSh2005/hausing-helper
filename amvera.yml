# Конфигурация для Amvera Cloud: https://docs.amvera.ru/applications/configuration/docker.html
# Собирается Dockerfile из корня репозитория, база лежит в постоянном хранилище /data.
meta:
  environment: docker
  toolchain:
    name: docker
build:
  dockerfile: Dockerfile
run:
  persistenceMount: /data
  containerPort: 3000
